
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Medical Image</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="upload-page">

    <h1>Medical Image Upload</h1>
    <p>Artery Segmentation and Stenosis Detection</p>

    <form>
        <h2>Select Coronary Angiography Image</h2>

        <p>Choose an image from your computer.</p>

        <input type="file" id="medicalImage" accept="image/*" required>

        <br><br>

        <button type="button" onclick="previewImage()">
            Preview Image
        </button>

        <div>
            <h3>Image Preview</h3>
            <img id="preview" alt="Selected medical image preview"
                 style="max-width: 300px; display: none;">
        </div>
    </form>

    <p>
        <a href="dashboard.html">Back to Dashboard</a>
    </p>

    <script>
        function previewImage() {
            const input = document.getElementById("medicalImage");
            const preview = document.getElementById("preview");

            if (input.files.length === 0) {
                alert("Please select an image first.");
                return;
            }

            preview.src = URL.createObjectURL(input.files[0]);
            preview.style.display = "block";
        }
    </script>

</body>
</html>
